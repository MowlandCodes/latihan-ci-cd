name: VoltCalc Pro

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Install Dependencies
        run: bun ci
      
      - name: Run Tests
        run: bun test --coverage

      - name: Build Production Bundle
        run: bun run build
